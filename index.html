<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0716">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="IMUGI RISE — a one-tap flight through Korean folklore. Unreleased preview build.">
<title>IMUGI RISE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="stage">
  <canvas id="c" data-i18n-aria="aria.canvas"></canvas>

  <div id="topBar">
    <div class="pill" id="shardPill" data-i18n-aria="aria.coins"><i>◎</i><span id="shardCount">0</span></div>
    <button class="ib" id="sfxBtn" data-i18n-aria="aria.sfx" aria-pressed="true">♪</button>
    <button class="ib" id="musicBtn" data-i18n-aria="aria.music" aria-pressed="true">♫</button>
    <button class="ib" id="pauseBtn" data-i18n-aria="aria.pause" hidden>II</button>
  </div>
  <button id="dashBtn" data-i18n="hud.dashBtn" hidden></button>
  <div id="coach" role="status" aria-live="polite" hidden></div>
  <button class="tab" id="tutorialSkip" data-i18n="tutorial.skip" hidden></button>
  <div id="caption" aria-live="polite" hidden>
    <div id="capKicker"></div>
    <div id="capTitle" hidden></div>
    <div id="capSkip" data-i18n="cutscene.skip"></div>
  </div>

  <section class="overlay" id="menu">
    <div class="preview" data-i18n="meta.preview"></div>
    <div>
      <div class="logo" data-i18n="meta.title"></div>
      <div class="year" data-i18n="meta.subtitle"></div>
    </div>
    <p class="tag" data-i18n="meta.tagline"></p>
    <div class="modes">
      <button class="btn" id="playBtn"></button>
      <button class="btn alt" id="dailyBtn"><span data-i18n="menu.daily"></span><small id="dailyInfo"></small></button>
      <div class="row">
        <button class="btn alt small" id="endlessBtn" data-i18n="menu.endless" hidden></button>
        <button class="btn alt small" id="trialBtn" data-i18n="menu.trial" hidden></button>
      </div>
    </div>
    <nav class="tabs" data-i18n-aria="aria.menu">
      <button class="tab" data-panel="missions"><span data-i18n="menu.missions"></span><i id="missionDot" hidden></i></button>
      <button class="tab" data-panel="units" data-i18n="menu.units"></button>
      <button class="tab" data-panel="lore" data-i18n="menu.lore"></button>
      <button class="tab" data-panel="records" data-i18n="menu.records"></button>
      <button class="tab" data-panel="help" data-i18n="menu.help"></button>
      <button class="tab" data-panel="settings" data-i18n="menu.settings"></button>
    </nav>
    <div class="hint" id="menuBest"></div>
  </section>

  <section class="overlay" id="panel" hidden>
    <div class="card wide">
      <h2 class="panel-title" id="panelTitle"></h2>
      <div id="panelBody"></div>
      <button class="btn small" id="panelClose" data-i18n="panel.back"></button>
    </div>
  </section>

  <section class="overlay" id="pauseScr" hidden>
    <div class="over-title cool" data-i18n="pause.title"></div>
    <button class="btn" id="resumeBtn" data-i18n="pause.resume"></button>
    <button class="btn alt small" id="quitBtn" data-i18n="over.menu"></button>
  </section>

  <section class="overlay" id="reviveScr" hidden>
    <div class="card">
      <div class="over-title cool" data-i18n="revive.title"></div>
      <div class="big" id="reviveCount">4</div>
      <button class="btn" id="reviveBtn"><span data-i18n="revive.button"></span> <i>◎</i><span id="reviveCost"></span></button>
      <button class="btn alt small" id="skipBtn" data-i18n="revive.skip"></button>
    </div>
  </section>

  <section class="overlay" id="over" hidden>
    <div class="card">
      <div class="over-title" id="oTitle"></div>
      <div class="hint" id="oMode"></div>
      <div class="big" id="oScore">0</div>
      <div class="rank" id="oRank"></div>
      <div class="newbest" id="oNew" data-i18n="over.newBest" hidden></div>
      <div class="hint" id="oBoard" hidden></div>
      <div class="stats" id="oStats"></div>
      <div id="oMissions"></div>
      <div class="row">
        <button class="btn" id="retryBtn" data-i18n="over.retry"></button>
      </div>
      <div class="row">
        <button class="btn alt small" id="shareBtn" data-i18n="over.share"></button>
        <button class="btn alt small" id="menuBtn" data-i18n="over.menu"></button>
      </div>
    </div>
  </section>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
